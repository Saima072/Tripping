# Local development stack. Frontend runs separately via `npm run dev:web`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripswipe
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tripswipe
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in your shell or an env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in your shell or an env file}
      CORS_ORIGIN: http://localhost:5173
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
